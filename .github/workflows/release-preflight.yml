name: release-preflight

on:
  pull_request:
    paths:
      - ".github/workflows/release-preflight.yml"
      - "CHANGELOG.md"
      - "docs/releases/**"
      - "scripts/release_preflight.py"
      - "src/skill2workflow/release.py"
      - "src/skill2workflow/__init__.py"
      - "pyproject.toml"
      - "tests/test_release_preflight.py"
      - "scripts/package_smoke.py"
      - "tests/test_package_smoke.py"
      - "tests/test_packaging.py"
      - "tests/test_changelog.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Read package version
        id: package
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          match = re.search(
              r'(?m)^version\s*=\s*["\']([^"\']+)["\']',
              Path("pyproject.toml").read_text(encoding="utf-8"),
          )
          if not match:
              raise SystemExit("pyproject.toml does not declare a project version")
          print(f"version={match.group(1)}")
          PY
      - name: Run release preflight dry-run
        run: |
          PYTHONPATH=src python scripts/release_preflight.py \
            --version "${{ steps.package.outputs.version }}" \
            --notes "docs/releases/v${{ steps.package.outputs.version }}.md" \
            --dry-run \
            --skip-git
