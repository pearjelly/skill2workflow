name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
        include:
          # Python 3.9 has no setup-python build for Ubuntu 26.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m py_compile src/skill2workflow/*.py
      - run: python scripts/package_smoke.py --work-dir /tmp/skill2workflow-package-smoke
      - run: python scripts/security_boundary_smoke.py --work-dir /tmp/skill2workflow-security-ci
      - run: python scripts/observability_smoke.py --work-dir /tmp/skill2workflow-observability-ci
      - run: python scripts/observability_rules_smoke.py
      - run: python scripts/observability_dashboard_smoke.py
      - run: python scripts/service_boundary_smoke.py --work-dir /tmp/skill2workflow-service-boundary-ci
      - run: python scripts/secret_hygiene.py examples/workflows
      - run: python scripts/secret_hygiene.py --repository-root .

  systemd-verify:
    name: systemd unit verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python scripts/systemd_service_smoke.py --work-dir /tmp/skill2workflow-systemd-service-ci --systemd-analyze-verify

  docker-service:
    name: single-service Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/docker_service_smoke.py

  operational-gates:
    name: recovery and state-safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python scripts/backup_restore_smoke.py --work-dir /tmp/skill2workflow-backup-ci
      - run: python scripts/state_upgrade_smoke.py --work-dir /tmp/skill2workflow-state-upgrade-ci
      - run: python scripts/retention_smoke.py --work-dir /tmp/skill2workflow-retention-ci
      - run: python scripts/cancellation_smoke.py --work-dir /tmp/skill2workflow-cancellation-ci
      - run: python scripts/interrupted_recovery_smoke.py --work-dir /tmp/skill2workflow-interrupted-ci
      - run: python scripts/schedule_smoke.py --work-dir /tmp/skill2workflow-schedule-ci
      - run: python scripts/recurring_scheduler_smoke.py --work-dir /tmp/skill2workflow-recurring-scheduler-ci
      - run: python scripts/service_doctor_smoke.py --work-dir /tmp/skill2workflow-service-doctor-ci
      - run: python scripts/service_soak_smoke.py --work-dir /tmp/skill2workflow-service-soak-ci --cycles 3 --triggers-per-cycle 6

  user-journey-gates:
    name: local user journey gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python scripts/pilot_playbook_smoke.py --work-dir /tmp/skill2workflow-pilot-ci
      - run: python scripts/pilot_scenario_pack_smoke.py --work-dir /tmp/skill2workflow-pilot-pack-ci
      - run: python scripts/external_connector_smoke.py --work-dir /tmp/skill2workflow-external-connector-ci
      - run: python scripts/quickstart_smoke.py --work-dir /tmp/skill2workflow-quickstart-ci
      - run: python scripts/authoring_delivery_smoke.py --work-dir /tmp/skill2workflow-authoring-delivery-ci
      - run: python scripts/skill_version_smoke.py

  artifact-gates:
    name: release artifact gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: node --test tests/test_*.cjs
      - run: python scripts/package_smoke.py --work-dir /tmp/skill2workflow-package-artifact-ci
      - run: python scripts/draft_input_ui_smoke.py --executable /tmp/skill2workflow-package-artifact-ci/venv/bin/skill2workflow --browser-module-tests
      - run: python scripts/skill_compile_recovery_smoke.py --executable /tmp/skill2workflow-package-artifact-ci/venv/bin/skill2workflow --browser-module-tests
      - run: python scripts/reproducible_build.py --work-dir /tmp/skill2workflow-reproducible-build-ci
      - run: python scripts/secret_hygiene.py --repository-root .
