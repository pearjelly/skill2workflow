name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m py_compile src/skill2workflow/*.py
      - run: python scripts/package_smoke.py --work-dir /tmp/skill2workflow-package-smoke
      - run: python scripts/secret_hygiene.py examples/workflows
      - run: python scripts/secret_hygiene.py --repository-root .

  systemd-verify:
    name: systemd unit verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python scripts/systemd_service_smoke.py --work-dir /tmp/skill2workflow-systemd-service-ci --systemd-analyze-verify
