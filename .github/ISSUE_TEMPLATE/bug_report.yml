name: Bug report
description: Report a reproducible problem in the CLI, DSL, runtime, service, editor, packaging, or docs.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for a contributor to reproduce it from a fresh checkout. Do not report security vulnerabilities here; use the private reporting link in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parser
        - Compiler / Validator
        - Workflow DSL
        - Executor
        - Control Plane
        - Runtime Service / Ingress
        - Scheduling
        - Backup / Migration / Retention
        - Observability
        - Connector Runtime
        - LiteGraph Editor
        - Documentation
        - CI / Packaging
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, input files, and relevant output.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, storage mode, and whether the installed CLI or source checkout was used.
      placeholder: "Ubuntu 24.04, Python 3.14, SQLite service, installed wheel"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or workflow snippets
      description: Paste minimal logs, validation output, or Workflow DSL snippets. Remove secrets, credentials, customer data, and private paths.
      render: text
